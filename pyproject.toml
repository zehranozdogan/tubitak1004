[project]
name = "qr-freshness"
version = "0.1.0"
description = "QR Kod Tabanli Akilli Tazelik Sensoru - uctan uca prototip (uretici + tuketici + ortak motor paketleri)"
requires-python = ">=3.10"
dependencies = [
    "segno>=1.6",
    "jsonschema>=4.20",
    "Pillow>=10",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
ui = ["flet>=0.86,<0.90", "flet-desktop>=0.86,<0.90"]   # apps/consumer prototipi
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
