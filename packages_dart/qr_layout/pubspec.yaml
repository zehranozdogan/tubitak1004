name: qr_layout
description: >
  packages/qr_layout (Python) reaktif hücre yerleşimi + QR geometrisinin
  Dart portu. Gerçek QR encoding artık `qr` paketi (kevmoo/qr.dart, ISO/IEC
  18004 uyumlu saf Dart) ile yapılıyor (bkz. lib/src/generator.dart) —
  segno'nun yerini alıyor.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.13.4

dependencies:
  qr: ^4.0.0
  image: ^4.5.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
